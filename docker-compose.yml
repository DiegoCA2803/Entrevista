version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: minefleet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mine_user
      POSTGRES_PASSWORD: mine_password
      POSTGRES_DB: mine_fleet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/repositories/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mine_user -d mine_fleet"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minefleet_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgres://mine_user:mine_password@postgres:5432/mine_fleet
    ports:
      - "4000:4000"

volumes:
  postgres_data:
